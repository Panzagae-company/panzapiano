<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판강피아노</title>

    <link rel="icon" href="판.png" type="image/png">
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; 
            background-image: url('background(26summer).png'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-color: #2c3e50; 
            margin: 0; font-family: sans-serif;
            overflow-x: auto; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .piano { 
            background: rgba(255, 255, 255, 0.3); 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
        }

        .keyboard {
            display: flex; 
            position: relative; 
        }
        
        .key-label {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            bottom: 10px; 
            line-height: 1.1;
            pointer-events: none; 
        }

        .dog-icon {
            width: 22px; 
            height: 22px;
            margin-bottom: 2px;
            object-fit: contain; 
        }

        .key-char {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .note-name {
            font-size: 0.75rem;
            margin-top: 2px;
            font-weight: normal;
        }

        .key.white { 
            width: 60px; height: 250px; background: white; 
            border: 1px solid #ccc; border-radius: 0 0 5px 5px; 
            cursor: pointer; display: flex; align-items: flex-end; 
            justify-content: center; 
            padding-bottom: 0px; 
            color: #333; z-index: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.1s;
            box-sizing: border-box;
        }
        .key.white .note-name { color: #666; }
        .key.white.active { background: #e0e0e0; transform: translateY(2px); }

        .key.black { 
            width: 40px; height: 150px; background: #1a1a1a; 
            color: white; position: absolute; z-index: 2; top: 0; 
            border-radius: 0 0 4px 4px; display: flex; 
            align-items: flex-end; justify-content: center; 
            padding-bottom: 0px; 
            box-sizing: border-box;
            cursor: pointer;
        }
        .key.black .note-name { color: #aaa; }
        .key.black.active { background: #4a4a4a; transform: translateY(2px); }

        .k-s { left: 40px; } .k-d { left: 100px; } .k-2 { left: 220px; } .k-3 { left: 280px; } .k-4 { left: 340px; }
        .k-6 { left: 460px; } .k-7 { left: 520px; } .k-9 { left: 640px; } .k-0 { left: 700px; } .k-minus { left: 760px; }
        .k-f { left: 880px; } .k-g { left: 940px; } .k-j { left: 1060px; } .k-k { left: 1120px; } .k-l { left: 1180px; }

                .pansuni-extra {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: auto;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        }
        .pansuni-extra:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div class="piano">
    <div class="keyboard">
        <!-- 3옥타브 -->
        <div class="key white" data-key="z"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">Z</span><span class="note-name">도</span></span></div>
        <div class="key black k-s" data-key="s"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">S</span><span class="note-name">도#</span></span></div>
        <div class="key white" data-key="x"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">X</span><span class="note-name">레</span></span></div>
        <div class="key black k-d" data-key="d"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">D</span><span class="note-name">레#</span></span></div>
        <div class="key white" data-key="c"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">C</span><span class="note-name">미</span></span></div>
        <div class="key white" data-key="q"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">Q</span><span class="note-name">파</span></span></div>
        <div class="key black k-2" data-key="2"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">2</span><span class="note-name">파#</span></span></div>
        <div class="key white" data-key="w"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">W</span><span class="note-name">솔</span></span></div>
        <div class="key black k-3" data-key="3"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">3</span><span class="note-name">솔#</span></span></div>
        <div class="key white" data-key="e"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">E</span><span class="note-name">라</span></span></div>
        <div class="key black k-4" data-key="4"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">4</span><span class="note-name">라#</span></span></div>
        <div class="key white" data-key="r"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">R</span><span class="note-name">시</span></span></div>

        <!-- 4옥타브 -->
        <div class="key white" data-key="t"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">T</span><span class="note-name">도</span></span></div>
        <div class="key black k-6" data-key="6"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">6</span><span class="note-name">도#</span></span></div>
        <div class="key white" data-key="y"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">Y</span><span class="note-name">레</span></span></div>
        <div class="key black k-7" data-key="7"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">7</span><span class="note-name">레#</span></span></div>
        <div class="key white" data-key="u"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">U</span><span class="note-name">미</span></span></div>
        <div class="key white" data-key="i"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">I</span><span class="note-name">파</span></span></div>
        <div class="key black k-9" data-key="9"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">9</span><span class="note-name">파#</span></span></div>
        <div class="key white" data-key="o"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">O</span><span class="note-name">솔</span></span></div>
        <div class="key black k-0" data-key="0"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">0</span><span class="note-name">솔#</span></span></div>
        <div class="key white" data-key="p"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">P</span><span class="note-name">라</span></span></div>
        <div class="key black k-minus" data-key="-"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">-</span><span class="note-name">라#</span></span></div>
        <div class="key white" data-key="["><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">[</span><span class="note-name">시</span></span></div>

        <!-- 5옥타브 -->
        <div class="key white" data-key="]"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">]</span><span class="note-name">도</span></span></div>
        <div class="key black k-f" data-key="f"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">F</span><span class="note-name">도#</span></span></div>
        <div class="key white" data-key="v"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">V</span><span class="note-name">레</span></span></div>
        <div class="key black k-g" data-key="g"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">G</span><span class="note-name">레#</span></span></div>
        <div class="key white" data-key="b"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">B</span><span class="note-name">미</span></span></div>
        <div class="key white" data-key="n"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">N</span><span class="note-name">파</span></span></div>
        <div class="key black k-j" data-key="j"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">J</span><span class="note-name">파#</span></span></div>
        <div class="key white" data-key="m"><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">M</span><span class="note-name">솔</span></span></div>
        <div class="key black k-k" data-key="k"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">K</span><span class="note-name">솔#</span></span></div>
        <div class="key white" data-key=","><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">,</span><span class="note-name">라</span></span></div>
        <div class="key black k-l" data-key="l"><span class="key-label"><img src="판순이.png" class="dog-icon"><span class="key-char">L</span><span class="note-name">라#</span></span></div>
        <div class="key white" data-key="."><span class="key-label"><img src="판돌이.png" class="dog-icon"><span class="key-char">.</span><span class="note-name">시</span></span></div>
    </div>
</div>
